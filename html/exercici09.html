<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Exercici 9 - Contacta'm">
    <meta name="author" content="Biel">
    <title>Contacta'm</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Contacta'm</h1>
    <p>Omple el formulari i et respondré el més aviat possible.</p>

    <form action="#" method="post">

        <p>
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">
        </p>

        <p>
            <label for="email">Correu electrònic:</label>
            <input type="email" id="email" name="email" placeholder="Escriu el teu correu electrònic">
        </p>

        <p>
            <label for="missatge">Missatge:</label><br>
            <textarea id="missatge" name="missatge" rows="6" cols="40" placeholder="Que em vols dir?"></textarea>
        </p>

        <button type="submit">Enviar</button>

    </form>

</body>

</html>
