<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Exercici 10 - Registre tipic">
    <meta name="author" content="Biel">
    <title>Registre</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Crea't un compte</h1>

    <form action="#" method="post">

        <p>
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="El teu nom">
        </p>

        <p>
            <label for="email">Correu electrònic:</label>
            <input type="email" id="email" name="email" placeholder="exemple@correu.com">
        </p>

        <p>
            <label for="contrasenya">Contrasenya:</label>
            <input type="password" id="contrasenya" name="contrasenya">
        </p>

        <p>
            <label for="naixement">Data de naixement:</label>
            <input type="date" id="naixement" name="naixement">
        </p>

        <p>
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Vull rebre novetats per correu</label>
        </p>

        <p>
            <input type="checkbox" id="termes" name="termes" required>
            <label for="termes">Accepto els termes i condicions</label>
        </p>

        <button type="submit">Registrar-me</button>

    </form>

</body>

</html>
